# FREE-tier Blueprint: dashboard + MLflow server + free Postgres. No paid plan, no disk.
# Limits: free services sleep after 15 min idle; free Postgres expires after 30 days;
# MLflow artifacts/trace payloads live on an ephemeral filesystem (metrics are kept in Postgres).
databases:
  - name: mlflow-db
    plan: free
    databaseName: mlflow
    user: mlflow

services:
  # ---------------------------------------------------------------- Django dashboard
  - type: web
    name: autoencoder-fraud-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-observability.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn fraud_dashboard.wsgi:application --workers 1 --threads 2 --timeout 60
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: DEMO_ANOMALY_THRESHOLD
        value: "0.50"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: MLFLOW_TRACING_ENABLED
        value: "true"
      - key: MLFLOW_TRACKING_URI          # https://mlflow-tracking-server.onrender.com (set after MLflow is live)
        sync: false
      - key: MLFLOW_TRACKING_USERNAME
        value: admin
      - key: MLFLOW_TRACKING_PASSWORD     # same value as MLFLOW_ADMIN_PASSWORD below
        sync: false
      - key: MLFLOW_EXPERIMENT_NAME
        value: fraud-detection-inference
      - key: OBSERVABILITY_STATUS_TOKEN
        generateValue: true

  # ---------------------------------------------------------------- MLflow server (free)
  - type: web
    name: mlflow-tracking-server
    runtime: docker
    plan: free
    dockerfilePath: ./mlflow_server/Dockerfile
    dockerContext: ./mlflow_server
    healthCheckPath: /health
    envVars:
      - key: MLFLOW_BACKEND_STORE_URI
        fromDatabase:
          name: mlflow-db
          property: connectionString
      - key: MLFLOW_ADMIN_USERNAME
        value: admin
      - key: MLFLOW_ADMIN_PASSWORD        # letters and digits only
        sync: false
      - key: MLFLOW_ARTIFACTS_DESTINATION # ephemeral on the free plan
        value: /tmp/mlflow-artifacts
      - key: MLFLOW_WORKERS               # 512 MB RAM: keep at 1
        value: "1"
