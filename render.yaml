services:
  - type: web
    name: autoencoder-fraud-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn fraud_dashboard.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
