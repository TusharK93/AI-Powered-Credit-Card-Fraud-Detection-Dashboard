 Render FREE blueprint: Django dashboard only. MLflow tracking is hosted on DagsHub.
services:
  - type: web
    name: autoencoder-fraud-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-observability.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn fraud_dashboard.wsgi:application --workers 1 --threads 2 --timeout 60
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: DEMO_ANOMALY_THRESHOLD
        value: "0.50"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: MLFLOW_TRACING_ENABLED
        value: "true"
      - key: MLFLOW_TRACKING_URI
        value: https://dagshub.com/tukumawat73/Fraud-Detection.mlflow
      - key: MLFLOW_TRACKING_USERNAME
        value: tukumawat73
      - key: MLFLOW_TRACKING_PASSWORD     # your DagsHub access token (set in Render, never in GitHub)
        sync: false
      - key: MLFLOW_EXPERIMENT_NAME
        value: fraud-detection-inference
      - key: OBSERVABILITY_STATUS_TOKEN
        generateValue: true
 
